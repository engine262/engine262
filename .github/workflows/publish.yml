name: publish

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_commit.message, 'no-publish') }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      # Set everything up
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: 'recursive'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Run tests and whatnot
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Publish to npm registry
      - run: pnpm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
      - run: pnpm config set registry https://registry.npmjs.org
      - run: pnpm publish --provenance --access public --tag latest
      # - run: pnpm --filter @engine262/babel-compiler publish --provenance --access public --tag latest
      # - run: pnpm --filter @engine262/eslint-plugin publish --provenance --access public --tag latest

      # Publish to github registry
      - run: pnpm config set //npm.pkg.github.com/:_authToken ${{ github.token }}
      - run: pnpm config set registry https://npm.pkg.github.com
      - run: pnpm publish --provenance --access public --tag latest

      # Push build to to gh-pages
      - run: |
          git config --global user.email "gha@example.com"
          git config --global user.name "GHA"
          git remote add github "https://$GITHUB_ACTOR:$BETTER_GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"

          git fetch github
          git checkout gh-pages

          cp -r lib/* .
          git add engine262.*
          git add inspector.*
          git commit -m "autobuild" || exit 0 # exit silently if nothing changed
          git push -u github gh-pages
        env:
          BETTER_GITHUB_TOKEN: ${{secrets.BETTER_GITHUB_TOKEN}}
